Arial" font-size="16" lengthAdjust="spacing" textLength="159.1875" x="52.5" y="431.5049">-customShare: Double</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="152.0781" x="52.5" y="449.9033">-numberOfPeople: int</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="224.1016" x="52.5" y="468.3018">-participantNames: List&lt;String&gt;</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="138.7188" x="52.5" y="486.7002">-payerName: String</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="117.3672" x="52.5" y="505.0986">-currency: String</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="168.1094" x="52.5" y="523.4971">-exchangeRate: Double</text><line style="stroke:#60758A;stroke-width:0.5;" x1="47.5" x2="285.5938" y1="530.8877" y2="530.8877"/><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="154.3203" x="52.5" y="549.8955">+getAmount(): double</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="189.8906" x="52.5" y="568.2939">+getTotalAmount(): double</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="211.2344" x="52.5" y="586.6924">+updateAmounts(total, share)</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="228.0938" x="52.5" y="605.0908">+getAmountsOwedToMe(): Map</text></g><!--class ExpenseList--><g class="entity" data-entity="ExpenseList" data-source-line="37" data-uid="ent0004" id="entity_ExpenseList"><rect fill="#E3F3EF" height="28.3984" rx="2.5" ry="2.5" style="stroke:#60758A;stroke-width:0.5;" width="93.1641" x="194" y="157.5986"/><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="87.1641" x="197" y="177.6064">ExpenseList</text></g><!--class AppState--><g class="entity" data-entity="AppState" data-source-line="38" data-uid="ent0005" id="entity_AppState"><rect fill="#E3F3EF" height="28.3984" rx="2.5" ry="2.5" style="stroke:#60758A;stroke-width:0.5;" width="71.8281" x="283.5" y="49.0986"/><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="65.8281" x="286.5" y="69.1064">AppState</text></g><!--class Settlement--><g class="entity" data-entity="Settlement" data-source-line="39" data-uid="ent0006" id="entity_Settlement"><rect fill="#E3F3EF" height="73.1953" rx="2.5" ry="2.5" style="stroke:#60758A;stroke-width:0.5;" width="127.6328" x="322.5" y="135.0986"/><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="76.4844" x="348.0742" y="155.1064">Settlement</text><line style="stroke:#60758A;stroke-width:0.5;" x1="323.5" x2="449.1328" y1="163.4971" y2="163.4971"/><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="104.9375" x="328.5" y="182.5049">-person: String</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="115.6328" x="328.5" y="200.9033">-amount: double</text></g><g class="entity" data-entity="GMN11" data-source-line="48" data-uid="ent0012" id="entity_GMN11"><path d="M6,649.0986 L6,732.6924 A0,0 0 0 0 6,732.6924 L326.7109,732.6924 A0,0 0 0 0 326.7109,732.6924 L326.7109,659.0986 L316.7109,649.0986 L170.5,649.0986 L166.5,612.1361 L162.5,649.0986 L6,649.0986 A0,0 0 0 0 6,649.0986" fill="#FFF8DE" style="stroke:#BDAA65;stroke-width:0.5;"/><path d="M316.7109,649.0986 L316.7109,659.0986 L326.7109,659.0986 L316.7109,649.0986" fill="#FFF8DE" style="stroke:#BDAA65;stroke-width:0.5;"/><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="199.2266" x="12" y="669.1064">Personal-spending contract:</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="225.4453" x="12" y="687.5049">inherited amount = full SGD bill;</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="264.5859" x="12" y="705.9033">overridden getAmount() = own share.</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="299.7109" x="12" y="724.3018">A null customShare selects equal splitting.</text></g><g class="entity" data-entity="GMN14" data-source-line="54" data-uid="ent0015" id="entity_GMN14"><path d="M267.5,274.0986 L267.5,339.2939 A0,0 0 0 0 267.5,339.2939 L539.3438,339.2939 A0,0 0 0 0 539.3438,339.2939 L539.3438,284.0986 L529.3438,274.0986 L403.4541,274.0986 L391.0557,208.2402 L395.4541,274.0986 L267.5,274.0986 A0,0 0 0 0 267.5,274.0986" fill="#FFF8DE" style="stroke:#BDAA65;stroke-width:0.5;"/><path d="M529.3438,274.0986 L529.3438,284.0986 L539.3438,284.0986 L529.3438,274.0986" fill="#FFF8DE" style="stroke:#BDAA65;stroke-width:0.5;"/><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="248.5625" x="273.5" y="294.1064">Positive = money received by user.</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="225.4609" x="273.5" y="312.5049">Negative = money paid by user.</text><text fill="#243247" font-family="Arial" font-size="16" lengthAdjust="spacing" textLength="250.8438" x="273.5" y="330.9033">Payments do not change spending.</text></g><g class="link" data-entity-1="Expense" data-entity-2="SplitExpense" data-uid="lnk7" id="link_Expense_SplitExpense"><polygon fill="none" points="166.5,347.324,160.5,365.324,172.5,365.324,166.5,347.324" style="stroke:#53657A;stroke-width:1;"/><path d="M166.5,365.324 C166.5,376.3941 166.5,370.9977 166.5,384.0845" fill="none" style="stroke:#53657A;stroke-width:1;"/></g><g class="link" data-entity-1="AppState" data-entity-2="ExpenseList" data-uid="lnk8" id="link_AppState_ExpenseList"><polygon fill="#53657A" points="241.9571,157.4887,247.2305,149.1705,242.688